<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="buttons">
      <button data-action="clear" class="span-2 function">C</button>
      <button data-action="backspace" class="function">⌫</button>
      <button data-operator="÷" class="operator">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button data-operator="×" class="operator">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button data-operator="−" class="operator">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button data-operator="+" class="operator">+</button>

      <button data-number="0" class="span-2">0</button>
      <button data-number=".">.</button>
      <button data-action="equals" class="equals">=</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
